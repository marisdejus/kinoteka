<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Kinotēka</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c0f;--bg2:#16161b;--bg3:#1f1f26;--line:#2a2a33;--tx:#eceae4;--mut:#9b99a4;--acc:#ff8a3d;--ok:#5fd68a;--wish:#6aa8ff;--anti:#ff5c7a;--r:10px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,.logo{font-family:"Space Grotesk",Inter,sans-serif;letter-spacing:-.01em}
.hidden{display:none!important}
/* header */
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:12px 4vw;background:linear-gradient(#0c0c0fee,#0c0c0fcc);backdrop-filter:blur(10px);border-bottom:1px solid #ffffff0d}
.logo{font-weight:700;font-size:20px;color:var(--acc);text-decoration:none;white-space:nowrap}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav a{padding:6px 10px;border-radius:8px;text-decoration:none;color:var(--mut);white-space:nowrap}
nav a.on,nav a:hover{color:var(--tx);background:var(--bg3)}
.hright{margin-left:auto;display:flex;align-items:center;gap:8px}
#q{background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:200px}

#bar{position:fixed;left:0;right:0;top:0;height:3px;z-index:60;background:var(--acc);transform-origin:left;transform:scaleX(0);transition:transform .2s}
#barTxt{position:fixed;right:12px;bottom:12px;z-index:60;background:var(--bg3);border:1px solid var(--line);padding:8px 12px;border-radius:8px;font-size:13px}
.banner{margin:12px 4vw;padding:10px 14px;border:1px dashed var(--acc);border-radius:8px;color:var(--mut);font-size:13px}
main{padding-bottom:60px}
.page{padding:18px 4vw}
.page h1{margin:6px 0 4px;font-size:30px}
.sub{color:var(--mut);margin:0 0 16px}
/* hero */
.hero{position:relative;height:min(76vh,700px);min-height:420px;overflow:hidden;background:#000 var(--img) center/cover no-repeat}
.hv{position:absolute;inset:0;opacity:0;transition:opacity 1.2s}
.hv.on{opacity:1}
.hv iframe{position:absolute;top:50%;left:50%;width:max(100%,177.78vh);height:max(100%,56.25vw);transform:translate(-50%,-50%);border:0;pointer-events:none}
.hshade{position:absolute;inset:0;background:linear-gradient(90deg,#0c0c0fee 0%,#0c0c0f99 35%,transparent 70%),linear-gradient(0deg,var(--bg) 0%,transparent 40%)}
.hinfo{position:absolute;left:4vw;bottom:12%;max-width:560px}
.hinfo h1{font-size:clamp(30px,5vw,58px);line-height:1;margin:8px 0 12px}
.hinfo p{color:#d6d4ce;margin:0 0 18px}
.eyebrow{color:var(--acc);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.b{border:1px solid var(--line);background:var(--bg3);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.b:hover{border-color:#555}
.b.pri{background:var(--tx);color:#111;border-color:var(--tx)}

.mk{display:inline-flex;flex-wrap:wrap;gap:8px;align-items:center}

.mb.on[data-mark=wish]{background:var(--wish);color:#061226;border-color:var(--wish)}
.mb.on[data-mark=anti]{background:var(--anti);color:#2a0610;border-color:var(--anti)}
.who{font-size:12px;color:var(--mut)}
/* rows */
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:14px 4vw 0}
.tabs button{background:none;border:1px solid var(--line);border-radius:99px;padding:5px 12px;cursor:pointer;color:var(--mut)}
.tabs button.on{background:var(--tx);color:#111;border-color:var(--tx)}
.sec{padding:22px 4vw 0;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.12em}
.row{margin-top:18px}
.rh{display:flex;align-items:baseline;gap:10px;padding:0 4vw}
.rh h2{font-size:19px;margin:0 0 8px}

.rh button:hover{color:var(--tx)}
.sw{position:relative}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:150px;gap:10px;overflow-x:auto;padding:4px 4vw 8px;scroll-snap-type:x proximity;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.arr{position:absolute;top:0;bottom:44px;width:4vw;min-width:32px;border:0;background:#0c0c0fcc;font-size:30px;cursor:pointer;opacity:0;transition:opacity .2s;z-index:2}
.arr.l{left:0}.arr.r{right:0}
.sw:hover .arr{opacity:1}
@media (hover:none){.arr{display:none}}
/* cards */

.pw{position:relative;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--bg3);transition:transform .15s}
.card:hover .pw{transform:scale(1.03);box-shadow:0 8px 30px #000a}
.pw img{width:100%;height:100%;object-fit:cover;display:block}
.np{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;background:linear-gradient(160deg,hsl(var(--h) 45% 32%),hsl(calc(var(--h) + 50) 50% 14%))}
.np b{font-family:"Space Grotesk";font-size:18px;line-height:1.05}
.np span{font-size:12px;color:#ddd;margin-top:6px}
.cap{font-size:12.5px;margin-top:6px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap i{color:var(--mut);font-style:normal}
.why{font-size:11.5px;color:var(--mut);line-height:1.25;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badges{position:absolute;top:6px;left:6px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.bd{font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:99px}
.bd.w{background:var(--ok);color:#06210f}.bd.s{background:var(--wish);color:#061226}.bd.a{background:var(--anti);color:#2a0610}
.rt{position:absolute;top:6px;right:6px;font-size:11px;background:#000b;padding:2px 6px;border-radius:99px}

.card:hover .qa{opacity:1}
@media (hover:none){.qa{opacity:1;background:none;padding:6px}}
.qb{width:30px;height:30px;border-radius:50%;border:1px solid #fff6;background:#000a;cursor:pointer;display:grid;place-items:center;padding:0}
.qb svg{width:16px;height:16px}
.qb.on[data-mark=watched]{background:var(--ok);border-color:var(--ok);color:#06210f}
.qb.on[data-mark=wish]{background:var(--wish);border-color:var(--wish);color:#061226}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:18px 12px}

.mbox{max-width:980px;margin:0 auto;background:var(--bg2);border-radius:14px;overflow:hidden;position:relative}
.x{position:absolute;right:12px;top:12px;z-index:5;width:38px;height:38px;border-radius:50%;border:0;background:#000b;font-size:22px;cursor:pointer}

.mtr{position:absolute;inset:0;z-index:1}

.meta{color:#cfcdc7;font-size:14px;margin-bottom:12px}
.mbody{padding:10px 28px 28px}
.cols{display:grid;grid-template-columns:1.6fr 1fr;gap:28px}
.side div{margin-bottom:10px;font-size:14px}
.side .l{color:var(--mut)}
.lk{background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-decoration-color:#666;text-underline-offset:3px}
.lk:hover{color:var(--acc)}
.mbody h3{margin:26px 0 10px;font-size:17px}
.prov{display:flex;flex-wrap:wrap;gap:18px}
.pg span{display:block;font-size:12px;color:var(--mut);margin-bottom:6px}
.pg img{width:42px;height:42px;border-radius:9px;margin-right:6px}

.small{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}

  #q{width:110px}.strip{grid-auto-columns:112px}header{gap:10px;padding:10px 3vw;flex-wrap:wrap}.hright{margin-left:auto}nav{order:3;width:100%}.hero{height:62vh}}
/* forms */
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;max-width:760px}
.panel h3{margin:0 0 10px}
.in{background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.flt{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:18px}
.flt label{font-size:13px;color:var(--mut);display:flex;gap:6px;align-items:center}
.fix{display:grid;grid-template-columns:1fr 1fr;gap:16px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.fix .q{color:var(--mut);font-size:13px}
.fix form{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.res{grid-column:1/-1;display:flex;gap:10px;overflow-x:auto}
.mini{display:flex;gap:10px;align-items:center;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:6px;cursor:pointer;min-width:220px;text-align:left}
.mini:hover{border-color:var(--acc)}
.mini img,.mini .ph{width:40px;height:60px;object-fit:cover;border-radius:4px;background:#333;flex:none}

@media (max-width:760px){.fix{grid-template-columns:1fr}}
.login{max-width:360px;margin:12vh auto;padding:0 20px}
.login .in{width:100%;margin-bottom:10px}
.err{color:var(--anti);font-size:13px;min-height:18px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tx);color:#111;padding:10px 16px;border-radius:8px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}
.attrib{color:var(--mut);font-size:12px;margin-top:24px;max-width:760px}
.empty{color:var(--mut);padding:30px 0}
details summary{cursor:pointer;color:var(--mut);margin:16px 0 10px}
</style>
</head>
<body>
<div id="bar"></div><div id="barTxt" class="hidden"></div>
<div id="app"><div class="login"><p class="sub">Loading…</p></div></div>
<div id="modal" class="modal hidden"></div>
<div id="toast"></div>
<script>window.KINO_CONFIG = window.KINO_CONFIG || null;</script>
<script src="config.js"></script>
<script type="module">
/* ============ basics ============ */
const CFG = window.KINO_CONFIG || {};
const IMG = 'https://image.tmdb.org/t/p/';
const FBV = '10.12.2';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yr = s => (s ? (+String(s).slice(0, 4) || null) : null);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const r1 = x => (x ? Math.round(x * 10) / 10 : 0);
const hash = s => { let h = 2166136261; for (const c of String(s)) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619) } return (h >>> 0).toString(36) };
const sel = k => `"${CSS.escape(k)}"`;
let store;
const S = { user: null, users: {}, settings: {}, rows: [], titles: new Map(), marks: new Map(), items: [], byKey: new Map(), extra: new Map(),
  live: new Map(), view: 'us', homeTab: 'all', q: '', heroKey: null, homeRows: [], browse: null, listTab: 'wish', listSort: 'added',
  ex: { seed: 'all', type: 'both', min: '6.5', from: '', genre: '', hide: true }, busy: false, gen: {} };

function toast(m, ms = 2600) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), ms) }
function progress(done, total, label) {
  const bar = $('#bar'), tx = $('#barTxt');
  if (total == null) { bar.style.transform = 'scaleX(0)'; tx.classList.add('hidden'); return }
  bar.style.transform = `scaleX(${total ? done / total : 0})`; tx.classList.remove('hidden'); tx.textContent = `${label} ${done}/${total}`;
}
const ICON = {
  watched: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  wish: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  wishOn: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>',
};

/* ============ stores ============ */
function localStore() {
  const K = 'kino-local-v1'; let db;
  try { db = JSON.parse(localStorage.getItem(K)) || {} } catch { db = {} }
  const save = () => { try { localStorage.setItem(K, JSON.stringify(db)) } catch { toast('This browser ran out of local storage') } };
  const col = c => db[c] || (db[c] = {});
  const list = c => Object.entries(col(c)).map(([id, v]) => ({ id, ...JSON.parse(JSON.stringify(v)) }));
  const merge = (a, b) => { for (const [k, v] of Object.entries(b)) { if (v && typeof v === 'object' && !Array.isArray(v) && a[k] && typeof a[k] === 'object' && !Array.isArray(a[k])) merge(a[k], v); else a[k] = v } return a };
  const subs = {};
  return {
    mode: 'local',
    async init() { return { uid: 'local', email: 'this device' } },
    async signOut() {},
    async all(c) { return list(c) },
    async get(c, id) { return col(c)[id] || null },
    put(c, id, data) { col(c)[id] = merge(col(c)[id] || {}, JSON.parse(JSON.stringify(data))); this._d = true },
    async flush() { if (this._d) { save(); this._d = false } },
    watch(c, cb) { subs[c] = cb; cb(list(c)) },
    async mark(key, field, uid, on, snap) {
      const m = col('marks')[key] || (col('marks')[key] = {}); m[field] = m[field] || {};
      if (on) m[field][uid] = Date.now(); else delete m[field][uid];
      if (snap) m.snap = snap; save(); subs.marks && subs.marks(list('marks'));
    },
  };
}
async function firebaseStore(cfg) {
  const B = `https://www.gstatic.com/firebasejs/${FBV}/`;
  const [A, Au, F] = await Promise.all([import(B + 'firebase-app.js'), import(B + 'firebase-auth.js'), import(B + 'firebase-firestore.js')]);
  const app = A.initializeApp(cfg), auth = Au.getAuth(app);
  let db;
  try { db = F.initializeFirestore(app, { ignoreUndefinedProperties: true, localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }) }
  catch { db = F.initializeFirestore(app, { ignoreUndefinedProperties: true }) }
  let batch = null, n = 0;
  const st = {
    mode: 'cloud',
    init() { return new Promise(res => { const un = Au.onAuthStateChanged(auth, u => { un(); res(u ? { uid: u.uid, email: u.email } : null) }) }) },
    async signIn(email, pw) { const c = await Au.signInWithEmailAndPassword(auth, email, pw); return { uid: c.user.uid, email: c.user.email } },
    signOut() { return Au.signOut(auth) },
    async all(c) { const s = await F.getDocs(F.collection(db, c)); return s.docs.map(d => ({ id: d.id, ...d.data() })) },
    async get(c, id) { const s = await F.getDoc(F.doc(db, c, id)); return s.exists() ? s.data() : null },
    put(c, id, data) { if (!batch) { batch = F.writeBatch(db); n = 0 } batch.set(F.doc(db, c, id), data, { merge: true }); if (++n >= 150) return st.flush() },
    async flush() { if (batch) { const b = batch; batch = null; n = 0; await b.commit() } },
    watch(c, cb) { return F.onSnapshot(F.collection(db, c), s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))), e => toast('Sync error: ' + e.code)) },
    async mark(key, field, uid, on, snap) {
      const data = { [field]: { [uid]: on ? Date.now() : F.deleteField() } }; if (snap) data.snap = snap;
      await F.setDoc(F.doc(db, 'marks', key), data, { merge: true });
    },
  };
  return st;
}

/* ============ TMDB ============ */
async function tmdb(path, params = {}, tries = 3) {
  const tok = (S.settings.tmdb || '').trim();
  if (!tok) throw new Error('Add your TMDB token in Settings first');
  const u = new URL('https://api.themoviedb.org/3' + path);
  for (const [k, v] of Object.entries(params)) if (v !== '' && v != null) u.searchParams.set(k, v);
  const h = { accept: 'application/json' };
  if (tok.length > 40) h.Authorization = 'Bearer ' + tok; else u.searchParams.set('api_key', tok);
  let r;
  try { r = await fetch(u, { headers: h }) } catch (e) { if (tries) { await sleep(1200); return tmdb(path, params, tries - 1) } throw e }
  if ((r.status === 429 || r.status >= 500) && tries) { await sleep(1500); return tmdb(path, params, tries - 1) }
  if (r.status === 401) throw new Error('TMDB rejected the token — check Settings');
  if (!r.ok) throw new Error('TMDB error ' + r.status);
  return r.json();
}
async function pool(items, n, fn) {
  let i = 0; let err = null;
  const run = async () => { while (i < items.length && !err) { const k = i++; try { await fn(items[k], k) } catch (e) { console.warn(e); if (/token/.test(e.message)) err = e } } };
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, run));
  if (err) throw err;
}
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/&/g, ' and ').replace(/[^a-z0-9½]+/g, ' ').trim().replace(/^(the|a|an) /, '');
function sim(a, b) {
  a = norm(a); b = norm(b); if (!a || !b) return 0; if (a === b) return 1;
  if (a.length < 2 || b.length < 2) return 0;
  const bg = s => { const m = new Map(); for (let i = 0; i < s.length - 1; i++) { const g = s.slice(i, i + 2); m.set(g, (m.get(g) || 0) + 1) } return m };
  const A = bg(a), Bm = bg(b); let x = 0; for (const [g, c] of A) x += Math.min(c, Bm.get(g) || 0);
  return 2 * x / (a.length + b.length - 2);
}
async function searchTMDB(q, type, year) {
  const p = { query: q, include_adult: 'false' };
  if (year) p[type === 'movie' ? 'year' : 'first_air_date_year'] = year;
  const j = await tmdb(`/search/${type}`, p);
  return (j.results || []).map(x => ({ id: x.id, type, t: x.title || x.name, ot: x.original_title || x.original_name, y: yr(x.release_date || x.first_air_date), p: x.poster_path || null, n: x.vote_count || 0 }));
}
async function matchRow(row) {
  const q = row.query || row.title, qy = +row.qyear || +row.year || 0;
  const type = row.type === 'tv' ? 'tv' : 'movie';
  let res = await searchTMDB(q, type, qy);
  if (!res.length && qy) res = await searchTMDB(q, type, 0);
  if (!res.length) res = await searchTMDB(q, type === 'movie' ? 'tv' : 'movie', 0);
  if (!res.length) return { status: 'failed' };
  let best = null;
  for (const x of res.slice(0, 12)) {
    const s = Math.max(sim(q, x.t), sim(q, x.ot)); const yd = qy && x.y ? Math.abs(qy - x.y) : null;
    const sc = s * 2 - (yd == null ? 0.3 : Math.min(yd, 6) * 0.25) + Math.log10(1 + x.n) * 0.12;
    if (!best || sc > best.sc) best = { ...x, s, yd, sc };
  }
  const exact = res.filter(x => Math.max(sim(q, x.t), sim(q, x.ot)) >= 0.95).length;
  const ok = (best.s >= 0.8 && best.yd != null && best.yd <= 1) || (!qy && best.s >= 0.95 && exact === 1);
  return { status: ok ? 'matched' : 'check', type: best.type, id: best.id, sim: r1(best.s) };
}
function compact(type, j) {

/* ---------- import & matching ---------- */
function parseCSV(t) {
  const out = []; let row = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++ } else q = false } else f += c }
    else if (c === '"') q = true; else if (c === ',') { row.push(f); f = '' }
    else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; row.push(f); f = ''; if (row.some(x => x !== '')) out.push(row); row = [] }
    else f += c;
  }
  row.push(f); if (row.some(x => x !== '')) out.push(row); return out;
}
async function importCSV(text) {
  const [h, ...data] = parseCSV(text.replace(/^﻿/, '')); const ix = n => h.findIndex(x => x.trim().toLowerCase() === n);
  const I = { kind: ix('kind'), title: ix('title'), year: ix('year'), query: ix('query'), type: ix('type'), qyear: ix('qyear') };
  if (I.title < 0) { toast('No "title" column found'); return }
  const have = new Map(S.rows.map(r => [r.id, r])); let n = 0;
  for (const c of data) {
    const g = k => I[k] >= 0 ? (c[I[k]] || '').trim() : '';
    const title = g('title'); if (!title) continue;
    const kind = g('kind') || 'Film', year = g('year');
    const row = { kind, title, year, query: g('query') || title, type: g('type') || (kind === 'Course' ? 'skip' : kind === 'Series' ? 'tv' : 'movie'), qyear: g('qyear') || year };
    const id = 'r' + hash(title + '|' + year);
    const old = have.get(id);
    if (old) Object.assign(old, row); else { row.added = Date.now(); have.set(id, { id, ...row }); n++ }
    store.put('library', id, row);
  }
  await store.flush(); S.rows = [...have.values()]; rebuild();
  toast(`Imported: ${n} new, ${data.length - n} updated`);
  if (S.settings.tmdb) runMatching(); else settings();
}
async function runMatching({ refresh = false, retry = false } = {}) {
  if (S.busy) return toast('Already running…');
  try { await tmdb('/configuration') } catch (e) { return toast(e.message) }
  S.busy = true;
  try {
    const todo = S.rows.filter(r => r.type !== 'skip' && (!r.m || (retry && r.m.status === 'failed')));
    let done = 0; progress(0, todo.length, 'Matching');
    await pool(todo, 6, async r => { r.m = await matchRow(r); store.put('library', r.id, { m: r.m }); progress(++done, todo.length, 'Matching') });
    await store.flush();
    const keys = [...new Set(S.rows.filter(r => r.m?.id && !['failed', 'skip'].includes(r.m.status)).map(r => r.m.type + ':' + r.m.id))];
    const need = keys.filter(k => refresh || !S.titles.has(k));
    done = 0; progress(0, need.length, 'Fetching details');
    await pool(need, 6, async k => { const [t, id] = k.split(':'); const d = await fetchDetails(t, +id); S.titles.set(k, d); store.put('titles', k, d); progress(++done, need.length, 'Fetching details') });
    await store.flush(); rebuild();
    const c = s => S.rows.filter(r => r.m?.status === s).length;
    toast(`Done. ${c('failed')} not found, ${c('check')} to check → see Fix matches`, 6000);
  } catch (e) { toast(e.message, 5000) }
  S.busy = false; progress(); route();
}

}
function renderProfiles() {
  const P = Object.entries(S.users);
  $('#app').innerHTML = `<div class="login"><h1 class="logo" style="font-size:34px">Who's watching?</h1>
<div class="btns" style="margin:18px 0">${P.map(([id, u]) => `<button class="b" data-act="profile" data-v="${esc(id)}" style="font-size:18px;padding:14px 20px">${esc(u.name)}</button>`).join('')}</div>
<form data-form="profile" class="btns"><input class="in" name="n" placeholder="${P.length ? 'Add another profile' : 'Your name'}" style="flex:1"><button class="b pri">Add</button></form></div>`;
}
function pickProfile(id) {
  S.me = id; try { localStorage.setItem('kino-profile', id) } catch {}
  shell(); route();
}
async function loadAll() {
  $('#app').innerHTML = '<div class="login"><p class="sub">Loading your library…</p></div>';
  try { S.view = localStorage.getItem('kino-view') || 'us' } catch {}
  let rows, titles, settings, users;
  const slow = setTimeout(() => { const p = $('#app .sub'); if (p) p.innerHTML = 'Still loading… If this stays, the database may be blocking access (check the Firestore rules email) or an ad-blocker may block firestore.googleapis.com.' }, 8000);
  try { [rows, titles, settings, users] = await Promise.all([store.all('library'), store.all('titles'), store.get('meta', 'settings'), store.all('users')]) }
  catch (e) { clearTimeout(slow); console.error(e); $('#app').innerHTML = `<div class="login"><h1>Can't open the library</h1><p class="sub">${esc(e.code || e.message)}</p><p class="sub">${e.code === 'permission-denied' ? 'The database rules refused this login. Check the email in Firestore → Rules matches your login exactly (lowercase), then Publish.' : 'Send this message to Claude.'}</p>${store.mode === 'cloud' ? '<button class="b" data-act="signout">Sign out</button>' : ''}</div>`; return }
  clearTimeout(slow);
  S.rows = rows; S.titles = new Map(titles.map(({ id, ...d }) => [id, d])); S.settings = settings || {}; S.users = Object.fromEntries(users.map(({ id, ...u }) => [id, u]));
  rebuild();
  let saved = null; try { saved = localStorage.getItem('kino-profile') } catch {}
  if (saved && S.users[saved]) pickProfile(saved); else renderProfiles();
  let first = true;
  store.watch('marks', list => {
    const old = S.marks; S.marks = new Map(list.map(({ id, ...m }) => [id, m]));
    if (first) { first = false; if (S.me && $('header')) route(); return }
    for (const k of new Set([...old.keys(), ...S.marks.keys()])) if (JSON.stringify(old.get(k)) !== JSON.stringify(S.marks.get(k))) refreshKey(k);
  });
}
(async () => {
  try {
    store = CFG.firebase ? await firebaseStore(CFG.firebase) : localStore();
    S.user = await store.init();
    if (!S.user) return renderLogin();
    await loadAll();
  } catch (e) { console.error(e); $('#app').innerHTML = `<div class="login"><h1>Something broke</h1><p class="sub">${esc(e.code || e.message)}</p></div>` }
})();
</script>
</body>
</html>
